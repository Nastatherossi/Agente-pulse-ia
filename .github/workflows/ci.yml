# Official checks for every PR and push: unit/integration tests, TypeScript + production build,
# and browser tests (desktop + mobile). Uses mocks only: no OpenAI key, no paid calls.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Generated API bundle matches the sources
        run: |
          if ! git diff --exit-code -- api/conversation.js api/whatsapp.js api/auth-sms-hook.js api/admin.js api/reminders.js; then
            echo "api/ bundles are stale - run npm run build:api and commit"
            exit 1
          fi
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and mobile)
        run: npm run test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
